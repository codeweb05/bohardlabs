packages:
  - 'packages/*'
  - 'apps/*'

# One place to bump the versions every package and the showcase share. A package.json
# says "catalog:" instead of a range, so React never resolves to two copies across the
# workspace (which breaks hooks) and a peer-dep range can never drift from what the
# showcase actually runs against.
catalog:
  react: ^19.2.4
  react-dom: ^19.2.4
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@mui/material': ^7.3.7
  '@mui/icons-material': ^7.3.7
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@mui/x-date-pickers': ^8.26.0
  dayjs: ^1.11.19
  '@tanstack/react-query': ^5.90.20
  write-excel-file: ^3.0.6
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.13.18
  typescript: ^5.9.3
  vite: ^7.3.1
  vitest: ^4.1.11
  '@vitejs/plugin-react': ^5.1.2
  '@vitest/browser': ^4.1.11
  '@vitest/browser-playwright': ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  '@vitest/runner': ^4.1.11

# esbuild ships a prebuilt binary and needs its install script to unpack it. pnpm blocks
# postinstall scripts unless they are allowed here, which is the right default; this is the
# allow-list, not a bypass.
allowBuilds:
  esbuild: true
