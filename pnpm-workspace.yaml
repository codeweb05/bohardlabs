packages:
  - 'packages/*'
  - 'apps/*'

# One place to bump the versions every package and the showcase share. A package.json
# says "catalog:" instead of a range, so React never resolves to two copies across the
# workspace (which breaks hooks) and a peer-dep range can never drift from what the
# showcase actually runs against.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.3
  '@types/react-dom': ^19.3.0
  '@mui/material': ^9.6.0
  '@mui/icons-material': ^9.6.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@mui/x-date-pickers': ^9.18.0
  dayjs: ^1.11.23
  '@tanstack/react-query': ^5.108.4
  write-excel-file: ^4.1.1
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.14.10
  '@tanstack/react-form': ^1.33.5
  mui-tel-input: ^11.0.0
  date-fns: ^4.4.0
  zod: ^4.6.7
  '@types/google.maps': ^3.67.0
  cropperjs: ^2.3.1
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^4.1.12
  '@vitejs/plugin-react': ^6.3.0
  oxc-transform-react: ^0.156.0
  '@vitest/browser': ^4.1.12
  '@vitest/browser-playwright': ^4.1.12
  '@vitest/coverage-v8': ^4.1.12
  '@vitest/runner': ^4.1.11
  # Storybook packages release in lockstep; bump them together.
  storybook: ^10.6.9
  '@storybook/react-vite': ^10.6.9
  '@storybook/addon-docs': ^10.6.9
  '@storybook/addon-vitest': ^10.6.9
  '@storybook/addon-a11y': ^10.6.9
  '@storybook/addon-links': ^10.6.9
  eslint-plugin-storybook: ^10.6.9
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.13
  jsdom: ^30.1.3
  '@types/node': ^26.6.10

# esbuild ships a prebuilt binary and needs its install script to unpack it. pnpm blocks
# postinstall scripts unless they are allowed here, which is the right default; this is the
# allow-list, not a bypass.
# @storybook/react-vite 10.6 still asks for ^0.7, which pulls in a glob and a minimatch
# with open advisories. 0.9 swapped glob for tinyglobby. Drop this once Storybook's own
# range reaches 0.9.
overrides:
  '@joshwooding/vite-plugin-react-docgen-typescript': ^0.9.1

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - '@testing-library/react@16.3.3'
  - '@vitejs/plugin-react@6.1.1'
